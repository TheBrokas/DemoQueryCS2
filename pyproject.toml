[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demoquerycs2"
version = "1.1.0"
description = "Sketch a CS2 scenario on the radar and find matching moments in your own demos (ggViz-style retrieval)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "demoparser2>=0.35",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
demoquerycs2 = "demoquerycs2.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demoquerycs2 = ["web/static/*", "assets/maps/*"]
