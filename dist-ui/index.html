<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DemoQueryCS2</title>
<style>
  html, body { height: 100%; margin: 0; background: #101418; color: #8494a7;
    font: 15px "Segoe UI", system-ui, sans-serif; display: flex;
    align-items: center; justify-content: center; }
  .box { text-align: center; }
  .logo { font-size: 26px; color: #d7dee8; letter-spacing: .5px; margin-bottom: 18px; }
  .logo span { color: #4a9eff; font-weight: 700; }
  .spinner { width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid #2a3542; border-top-color: #4a9eff; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">DemoQuery<span>CS2</span></div>
    <div class="spinner"></div>
    <div>Starting engine&hellip;</div>
  </div>
</body>
</html>
